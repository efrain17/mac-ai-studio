# shellcheck shell=bash disable=SC2034
SERVICE_ID="50-models"
SERVICE_TITLE="Get Models"
# Not a tab: the app's Get Models button opens this page in a window of its own.
SERVICE_HIDDEN=1
SERVICE_PORT=17890
SERVICE_HEALTH_PATH="/api/job"
SERVICE_START_TIMEOUT=60

service_command() {
  # Same steps as get-models.sh (get_models.py, installed next to it), with a progress page.
  exec "$COMFYUI_ENV/bin/python" -I "$RUNTIME_DIR/models_page.py" --port "$PORT"
}
