# shellcheck shell=bash disable=SC2034
SERVICE_ID="30-stems-voices"
SERVICE_TITLE="Stems & Voices (Demucs)"
SERVICE_PORT=17870
SERVICE_START_HINT="The stems page is starting, which takes a few seconds. Demucs loads its weights on the first split."

service_command() {
  local tool_env="$ENVS_DIR/stems-voices"
  export PATH="$BREW_FFMPEG/bin:$PATH"
  export HF_HUB_OFFLINE=1
  export GRADIO_TEMP_DIR="$STUDIO_HOME/tmp/gradio-stems"
  exec "$tool_env/bin/python" "$RUNTIME_DIR/stems_voices.py" --port "$PORT"
}
