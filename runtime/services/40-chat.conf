# shellcheck shell=bash disable=SC2034
SERVICE_ID="40-chat"
SERVICE_TITLE="Chat (AnythingLLM)"
# AnythingLLM always serves its page on 3001 and cannot be told another port.
SERVICE_PORT=3001
SERVICE_HEALTH_PATH="/api/ping"
# The first start opens two apps and loads a 63 GB model.
SERVICE_START_TIMEOUT=300
LMS="$HOME/.lmstudio/bin/lms"

service_command() {
  if [ "$PORT" != "3001" ]; then
    echo "Port 3001 is used by another program, and AnythingLLM needs exactly that port."
    exit 1
  fi
  # LM Studio's server answers AnythingLLM and loads the chat model on the first question.
  "$LMS" server start --port 1234 --bind 127.0.0.1 || echo "LM Studio's server did not start."
  # Hidden and in the background: the page shows inside Mac AI Studio.
  open -gj -a AnythingLLM || exit 1
  sleep 5
  # Stays alive while AnythingLLM runs, so the studio knows the tool is up.
  while pgrep -f "AnythingLLM.app/Contents/MacOS" >/dev/null; do sleep 5; done
}

service_stop() {
  osascript -e 'tell application "AnythingLLM" to quit'
  "$LMS" unload --all
  "$LMS" server stop
}
