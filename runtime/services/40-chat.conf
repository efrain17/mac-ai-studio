# shellcheck shell=bash disable=SC2034
SERVICE_ID="40-chat"
SERVICE_TITLE="Chat (AnythingLLM)"
# The tab shows a small status page; the chat itself is AnythingLLM's own window, because the
# desktop app has no web page (its port 3001 answers the API only, and a browser gets a 404).
SERVICE_PORT=17880
SERVICE_HEALTH_PATH="/status"
# The first start opens two apps; the model itself loads on the first question.
SERVICE_START_TIMEOUT=300
SERVICE_START_HINT="LM Studio and AnythingLLM are opening. The chat happens in AnythingLLM's own window, which comes forward when it is ready."
LMS="$HOME/.lmstudio/bin/lms"

service_command() {
  # LM Studio's server answers AnythingLLM and loads the chat model on the first question.
  "$LMS" server start --port 1234 --bind 127.0.0.1 || echo "LM Studio's server did not start."
  open -a AnythingLLM || exit 1
  # AnythingLLM always uses port 3001. Until it answers there, the tab keeps its loading screen.
  local waited=0
  until curl -fs -o /dev/null --max-time 2 "http://127.0.0.1:3001/api/ping"; do
    if [ "$waited" -ge 240 ]; then
      echo "AnythingLLM did not answer on port 3001. If another program uses that port, quit it."
      exit 1
    fi
    sleep 2
    waited=$(( waited + 2 ))
  done
  exec "$COMFYUI_ENV/bin/python" -I "$RUNTIME_DIR/chat_launcher.py" --port "$PORT"
}

service_stop() {
  osascript -e 'tell application "AnythingLLM" to quit'
  "$LMS" unload --all
  "$LMS" server stop
}
