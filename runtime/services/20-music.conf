# shellcheck shell=bash disable=SC2034
SERVICE_ID="20-music"
SERVICE_TITLE="Music (ACE-Step)"
SERVICE_PORT=17860
SERVICE_CWD="$STUDIO_HOME/ace-step"
# The first start loads the models before the page answers.
SERVICE_START_TIMEOUT=900
SERVICE_START_HINT="ACE-Step loads its music models before the page answers. The first start takes several minutes."

service_command() {
  export PATH="$BREW_FFMPEG/bin:$PATH"
  # torchcodec finds FFmpeg here; macOS strips this variable from child scripts, so it is set last.
  export DYLD_FALLBACK_LIBRARY_PATH="$BREW_FFMPEG/lib"
  export HF_HUB_OFFLINE=1
  export TRANSFORMERS_OFFLINE=1
  export CHECK_UPDATE=false
  export ACESTEP_CHECKPOINTS_DIR="$MODELS_DIR/ace-step"
  export GRADIO_TEMP_DIR="$STUDIO_HOME/tmp/gradio-music"
  export XDG_DATA_HOME="$STUDIO_HOME/ace-step/.data"
  exec "$STUDIO_HOME/ace-step/.venv/bin/acestep" \
    --port "$PORT" --server-name 127.0.0.1 --language en \
    --config_path acestep-v15-xl-turbo --lm_model_path acestep-5Hz-lm-4B \
    --init_service true --backend mlx
}
