# shellcheck shell=bash disable=SC2034
SERVICE_ID="10-images"
SERVICE_TITLE="Images & Video"
SERVICE_PORT=18188
SERVICE_HEALTH_PATH="/system_stats"
SERVICE_CWD="$COMFYUI_DIR"

service_command() {
  # ComfyUI selects shared memory on Apple Silicon by itself, so no VRAM flag is needed.
  # Split attention prevents black video from bf16 models on Metal. --offline blocks the
  # page from reaching the internet.
  export HF_HUB_OFFLINE=1
  exec "$COMFYUI_ENV/bin/python" "$COMFYUI_DIR/main.py" \
    --listen 127.0.0.1 --port "$PORT" --disable-auto-launch \
    --use-split-cross-attention --offline \
    --input-directory "$INPUT_DIR" --output-directory "$OUTPUT_DIR"
}
